<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00163B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sea Ready">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<title>Sea Ready — 6-Month Fitness Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#00163B;--navy2:#04204D;--navy3:#0A2C63;--ink:#40445E;--steel:#657595;--mist:#D3D5E1;
  --teal:#16D0C5;--teal-d:#0FA79E;--white:#fff;--warn:#F5B942;--bad:#FF7A7A;--good:#16D0C5;
  --display:'Big Shoulders Display',Impact,'Arial Narrow Bold','Arial Narrow',sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --e-out:cubic-bezier(.16,1,.3,1);--e-io:cubic-bezier(.6,0,.4,1);
  --line:rgba(255,255,255,.12);--card:rgba(255,255,255,.035);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--navy)}
body{font-family:var(--body);background:var(--navy);color:var(--mist);font-size:16px;line-height:1.5;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--teal)}
.noise{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;background:
  radial-gradient(1200px 600px at 85% -10%,rgba(22,208,197,.10),transparent 60%),
  radial-gradient(900px 700px at -10% 110%,rgba(10,44,99,.9),transparent 60%)}
/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:40;padding:calc(var(--sat) + 10px) calc(20px + var(--sar)) 10px calc(20px + var(--sal));display:flex;align-items:center;gap:18px;background:rgba(0,22,59,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.status-dot{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--white)}
.status-dot i{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 0 rgba(22,208,197,.6);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,208,197,.55)}70%{box-shadow:0 0 0 10px rgba(22,208,197,0)}100%{box-shadow:0 0 0 0 rgba(22,208,197,0)}}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--white)}
.brand .mark{width:38px;height:38px;border:1.5px solid var(--white);display:grid;place-items:center}
.brand b{white-space:nowrap;font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.04em;line-height:1;text-transform:uppercase}
.brand small{display:block;font-size:10px;letter-spacing:.2em;color:var(--steel);font-weight:600;text-transform:uppercase}
nav.desk{margin-left:auto;display:flex;gap:4px}
nav.desk a{color:var(--mist);text-decoration:none;font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;padding:9px 12px;position:relative}
nav.desk a::after{content:"";position:absolute;left:12px;right:12px;bottom:3px;height:2px;background:var(--teal);transform:scaleX(0);transform-origin:right;transition:transform .5s var(--e-out)}
nav.desk a:hover::after,nav.desk a.on::after{transform:scaleX(1);transform-origin:left}
nav.desk a.on{color:var(--white)}
.profile-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--white);flex:none}
.profile-btn:hover{border-color:var(--teal)}
.sync-pill{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync-pill i{width:6px;height:6px;border-radius:50%;background:var(--steel)}
.sync-pill.on i{background:var(--teal)}
/* ---------- bottom nav ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:none;grid-template-columns:repeat(6,1fr);background:rgba(0,22,59,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px calc(4px + var(--sar)) calc(6px + var(--sab)) calc(4px + var(--sal))}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--steel);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:6px 0;position:relative;transition:color .3s}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a.on{color:var(--white)}
nav.tabs a.on::before{content:"";position:absolute;top:-7px;left:30%;right:30%;height:2px;background:var(--teal)}
@media (max-width:899px){nav.desk{display:none}nav.tabs{display:grid}main{padding-bottom:calc(90px + var(--sab))!important}.sync-pill{margin-left:auto}}
/* ---------- layout ---------- */
main{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:28px calc(20px + var(--sar)) 80px calc(20px + var(--sal))}
@media (min-width:900px){main{padding:44px 40px 100px}}
.view{animation:viewIn .9s var(--e-out) both}
@keyframes viewIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.wipe{position:fixed;inset:0;z-index:100;background:var(--navy2);transform:translateY(100%);pointer-events:none;visibility:hidden}
.wipe.go{visibility:visible;animation:wipe 1.05s var(--e-io) forwards}
.wipe::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--teal)}
@keyframes wipe{0%{transform:translateY(100%)}45%,55%{transform:translateY(0)}100%{transform:translateY(-100%)}}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--teal);display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:22px;height:1.5px;background:currentColor}
h1,h2,h3,.disp{font-family:var(--display);text-transform:uppercase;color:var(--white);font-weight:900;line-height:.9;letter-spacing:.005em}
h1{font-size:clamp(48px,9vw,120px);margin:10px 0 14px}
h2{font-size:clamp(30px,4.6vw,52px);margin:6px 0 14px}
h3{font-size:24px;font-weight:800;line-height:1;margin-bottom:8px}
.lead{max-width:640px;font-size:18px;color:var(--mist)}
.muted{color:var(--steel)}
.small{font-size:13px}
.sea{background-image:linear-gradient(100deg,rgba(255,255,255,0) 0 40%,rgba(22,208,197,.55) 50%,rgba(255,255,255,0) 60% 100%),repeating-linear-gradient(170deg,#ffffff 0 14px,#dfe6f5 14px 16px,#ffffff 16px 30px),linear-gradient(180deg,#fff,#c9d5ee);background-size:300% 100%,100% 200%,100% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sea 9s linear infinite}
@keyframes sea{0%{background-position:150% 0,0 0,0 0}100%{background-position:-150% 0,0 -200px,0 0}}
section{margin-top:44px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}
.card{position:relative;background:var(--card);border:1px solid var(--line);padding:22px;transition:border-color .4s,transform .6s var(--e-out),background .4s}
.card.x::before,.card.x::after{content:"+";position:absolute;font-size:16px;line-height:1;color:var(--teal);font-weight:400}
.card.x::before{top:-9px;left:-5px}.card.x::after{bottom:-9px;right:-5px}
.card.link{cursor:pointer}
.card.link:hover{border-color:rgba(22,208,197,.6);transform:translateY(-3px);background:rgba(255,255,255,.055)}
.card.solid{background:var(--navy2)}
.stat .num{font-family:var(--display);font-weight:900;font-size:clamp(40px,6vw,64px);color:var(--white);line-height:.9}
.stat .lab{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--steel);margin-bottom:8px}
.stat .sub{font-size:13px;color:var(--mist);margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--teal);color:var(--navy);font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:13px 22px;min-height:46px;text-decoration:none;transition:transform .3s var(--e-out),background .3s,box-shadow .3s;border:1.5px solid var(--teal)}
.btn:hover{background:#3ee0d7;box-shadow:0 8px 30px -8px rgba(22,208,197,.6)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--white);border-color:rgba(255,255,255,.7)}
.btn.ghost:hover{border-color:var(--teal);color:var(--teal);box-shadow:none}
.btn.sm{padding:8px 14px;min-height:36px;font-size:12px}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--mist);white-space:nowrap}
.tag.t{border-color:rgba(22,208,197,.6);color:var(--teal)}
.tag.w{border-color:rgba(245,185,66,.6);color:var(--warn)}
.tag.b{border-color:rgba(255,122,122,.6);color:var(--bad)}
.tag.solid{background:var(--teal);color:var(--navy);border-color:var(--teal)}
[data-reveal]{opacity:0;transform:translateY(34px);clip-path:inset(0 0 22% 0);transition:opacity .9s var(--e-out),transform .9s var(--e-out),clip-path 1.1s var(--e-out)}
[data-reveal].in{opacity:1;transform:none;clip-path:inset(0 0 0 0)}
.hr{height:1px;background:var(--line);margin:18px 0}
ul.clean{list-style:none}
ul.clean li{padding:9px 0;border-bottom:1px solid var(--line)}
ul.clean li:last-child{border-bottom:0}
.notes li{display:flex;gap:10px;align-items:flex-start}
.notes li::before{content:"";flex:none;width:8px;height:8px;margin-top:8px;background:var(--teal);transform:rotate(45deg)}
.notes li.w::before{background:var(--warn)}.notes li.b::before{background:var(--bad)}
/* forms */
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--steel)}
.inp,select.inp,textarea.inp{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--white);padding:12px 14px;font-size:16px;border-radius:0;min-height:46px;letter-spacing:0;text-transform:none;font-weight:500;width:100%;-webkit-appearance:none;appearance:none}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--teal) 50%),linear-gradient(135deg,var(--teal) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
select.inp option{background:var(--navy);color:#fff}
.inp:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(22,208,197,.2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:8px 14px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mist);transition:background .3s,color .3s}
.seg button.on{background:var(--teal);color:var(--navy)}
/* hero */
.hero{position:relative;padding:20px 0 10px;overflow:hidden}
.hero .mega{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(64px,15vw,210px);line-height:.82;letter-spacing:-.005em}
.hero .mega span{display:block;overflow:hidden}
.hero .mega span>em{display:block;font-style:normal;transform:translateY(105%);animation:rise 1.2s var(--e-out) forwards}
.hero .mega span:nth-child(2)>em{animation-delay:.12s}.hero .mega span:nth-child(3)>em{animation-delay:.24s}
@keyframes rise{to{transform:none}}
.crosshair{position:absolute;width:22px;height:22px;opacity:.6}
.crosshair::before,.crosshair::after{content:"";position:absolute;background:var(--white)}
.crosshair::before{left:10px;top:0;width:1.5px;height:22px}.crosshair::after{top:10px;left:0;height:1.5px;width:22px}
/* plan */
.timeline{display:grid;grid-template-columns:repeat(26,1fr);gap:3px;margin:18px 0 6px}
.timeline div{height:28px;background:rgba(255,255,255,.07);position:relative;cursor:pointer;transition:background .3s}
.timeline div.p1{background:rgba(101,117,149,.35)}.timeline div.p2{background:rgba(101,117,149,.55)}.timeline div.p3{background:rgba(22,208,197,.35)}.timeline div.p4{background:rgba(22,208,197,.6)}
.timeline div.dl{background-image:repeating-linear-gradient(135deg,transparent 0 4px,rgba(0,22,59,.6) 4px 6px)}
.timeline div.sel{outline:2px solid var(--white);outline-offset:1px}
.timeline div.now::after{content:"";position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);border:5px solid transparent;border-bottom-color:var(--teal)}
.week-h{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--steel);margin:22px 0 10px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
@media (max-width:1100px){.days{grid-template-columns:repeat(4,1fr)}}
@media (max-width:700px){.days{grid-template-columns:1fr 1fr}}
@media (max-width:380px){.days{grid-template-columns:1fr}}
.day{padding:14px;min-height:150px;display:flex;flex-direction:column;gap:6px}
.day .d{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--steel);display:flex;justify-content:space-between}
.day .t{font-family:var(--display);font-weight:800;font-size:21px;line-height:1;color:var(--white);text-transform:uppercase}
.day .s{font-size:13px;color:var(--mist);flex:1}
.day.today{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
.day.rest{opacity:.65}
.day.done{background:rgba(22,208,197,.08)}
.day .chk{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
.day.done .chk{background:var(--teal);border-color:var(--teal);color:var(--navy)}
.day.skip .chk{border-color:var(--bad);color:var(--bad)}
.kind{width:100%;height:3px;margin-bottom:4px}
.k-run{background:#9fb3d9}.k-hard{background:var(--teal)}.k-str{background:#f0f0f0}.k-rest{background:rgba(255,255,255,.15)}.k-test{background:var(--warn)}.k-mob{background:var(--steel)}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,10,30,.6);z-index:80;opacity:0;transition:opacity .4s;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.sheet-bg.on{opacity:1}
.sheet{position:fixed;z-index:81;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--navy2);border-top:2px solid var(--teal);padding:26px calc(22px + var(--sar)) calc(26px + var(--sab)) calc(22px + var(--sal));transform:translateY(100%);transition:transform .6s var(--e-out);-webkit-overflow-scrolling:touch}
.sheet.on{transform:none}
@media (min-width:900px){.sheet{left:50%;right:auto;bottom:auto;top:50%;width:640px;max-height:84vh;transform:translate(-50%,-40%);opacity:0;transition:transform .6s var(--e-out),opacity .4s;border:1px solid var(--line);border-top:2px solid var(--teal)}.sheet.on{transform:translate(-50%,-50%);opacity:1}}
.sheet .close{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--white)}
.blocks li{padding:12px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:28px 1fr;gap:8px}
.blocks li b{color:var(--white)}
.blocks li .n{font-family:var(--display);font-weight:800;color:var(--teal);font-size:20px;line-height:1.1}
.rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rpe button{padding:9px 0;border:1px solid var(--line);font-weight:700;font-size:14px}
.rpe button.on{background:var(--teal);color:var(--navy);border-color:var(--teal)}
/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--body);font-size:11px;fill:var(--steel);letter-spacing:.06em}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mist);margin-top:10px}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:6px}
/* meals */
.meal{display:grid;grid-template-columns:110px 1fr auto;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);align-items:start}
.meal:last-child{border-bottom:0}
.meal .slot{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);padding-top:3px}
.meal .nm{font-weight:700;color:var(--white);font-size:17px}
.meal .mac{font-size:13px;color:var(--steel);text-align:right;white-space:nowrap}
@media (max-width:600px){.meal{grid-template-columns:1fr auto}.meal .slot{grid-column:1/-1;padding:0}}
.bar{height:6px;background:rgba(255,255,255,.08);position:relative;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--teal);transition:width 1s var(--e-out)}
.daypick{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.daypick::-webkit-scrollbar{display:none}
.daypick button{flex:none;min-width:64px;padding:10px 8px;border:1px solid var(--line);text-align:center;transition:all .3s}
.daypick button b{display:block;font-family:var(--display);font-size:22px;color:var(--white);line-height:1}
.daypick button span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--steel)}
.daypick button.on{background:var(--teal);border-color:var(--teal)}
.daypick button.on b,.daypick button.on span{color:var(--navy)}
.daypick button.today{border-color:var(--teal)}
/* timer & bleep */
.big-timer{text-align:center;padding:10px 0}
.ring{position:relative;width:min(78vw,380px);aspect-ratio:1;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .c .v{font-family:var(--display);font-weight:900;color:var(--white);font-size:clamp(64px,20vw,128px);line-height:.85}
.ring .c .l{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--teal)}
.ring .c .s2{font-size:14px;color:var(--mist);margin-top:6px}
.bleep-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0}
@media (max-width:600px){.bleep-stats{grid-template-columns:repeat(2,1fr)}}
.bleep-stats .card{padding:14px;text-align:center}
.bleep-stats .num{font-size:clamp(30px,8vw,44px)}
.flash{animation:flash .5s var(--e-out)}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(22,208,197,.9),inset 0 0 120px rgba(22,208,197,.35)}100%{box-shadow:0 0 0 30px rgba(22,208,197,0),inset 0 0 0 rgba(22,208,197,0)}}
.lvl-flash{animation:lvl 1.1s var(--e-out)}
@keyframes lvl{0%{transform:scale(1.25);color:var(--teal)}100%{transform:none}}
.bleep-table{width:100%;border-collapse:collapse;font-size:14px}
.bleep-table th,.bleep-table td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.bleep-table th{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--steel)}
.bleep-table tr.pass td{color:var(--teal)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.focus-wrap{position:fixed;inset:0;z-index:70;background:var(--navy);display:flex;flex-direction:column;padding:calc(var(--sat) + 14px) calc(18px + var(--sar)) calc(var(--sab) + 18px) calc(18px + var(--sal));overflow:auto}
.focus-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.focus-mid{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:760px;width:100%;margin:0 auto}
.focus-bot{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;max-width:760px;width:100%;margin:0 auto}
.focus-bot .btn{flex:1;min-width:130px;min-height:60px;font-size:15px}
.xl-btn{min-height:76px!important;font-size:17px!important}

<script>
"use strict";
/* =========================================================
   Core utilities
   ========================================================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const z2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+z2(d.getMonth()+1)+'-'+z2(d.getDate());
const parseYMD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseYMD(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((parseYMD(b)-parseYMD(a))/864e5);
const today=()=>ymd(new Date());
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate=s=>{const d=parseYMD(s);return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]};
const fmtShort=s=>{const d=parseYMD(s);return d.getDate()+' '+MON[d.getMonth()]};
const mmss=sec=>{sec=Math.max(0,Math.round(sec));return Math.floor(sec/60)+':'+z2(sec%60)};
const paceStr=kmh=>kmh>0?mmss(3600/kmh)+'/km':'—';
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2600)}

/* =========================================================
   Bleep test maths (UK 20 m MSFT: L1 8.0 km/h, L2 9.0, +0.5 per level)
   ========================================================= */
const LV_N=[7,8,8,9,9,10,10,11,11,11,12,12,13,13,13,14,14,15,15,16,16];
const CUM=[0];LV_N.forEach((n,i)=>CUM.push(CUM[i]+n)); // CUM[L] = shuttles completed at end of level L
const lvSpeed=L=>L===1?8:8+0.5*L;
const shuttleSecs=L=>20/(lvSpeed(L)/3.6);
const toSh=(L,S)=>CUM[L-1]+S;
function fromSh(t){t=Math.round(t);if(t<=0)return{L:1,S:0};for(let L=1;L<=21;L++){if(t<=CUM[L])return{L,S:t-CUM[L-1]}}return{L:21,S:16}}
const fmtLS=t=>{if(t==null||isNaN(t))return '—';const r=fromSh(t);return r.L+'.'+r.S};
function parseLS(str){const m=String(str??'').trim().match(/^(\d{1,2})(?:[.,:](\d{1,2}))?$/);if(!m)return null;const L=+m[1],S=+(m[2]||0);if(L<1||L>21||S>LV_N[L-1])return null;return toSh(L,S)}
// VO2max estimate: linear fit to Ramsbottom (1988) table  VO2 ≈ 3.46 × (level + shuttle/shuttles-in-level) + 12.2
function vo2FromSh(t){const r=fromSh(t);return 3.46*(r.L+r.S/LV_N[r.L-1])+12.2}
function shFromVO2(v){let lv=(v-12.2)/3.46;lv=clamp(lv,1,21.99);const L=Math.floor(lv);return toSh(L,Math.round((lv-L)*LV_N[L-1]))}
// Running: Daniels/Gilbert VDOT from a run of distance/time
function vdot(km,min){if(!(km>0&&min>0))return null;const v=km*1000/min;const vo2=-4.6+0.182258*v+0.000104*v*v;const pct=0.8+0.1894393*Math.exp(-0.012778*min)+0.2989558*Math.exp(-0.1932605*min);return vo2/pct}
function vVO2(vo2){const a=0.000104,b=0.182258,c=-(vo2+4.6);const v=(-b+Math.sqrt(b*b-4*a*c))/(2*a);return v*60/1000} // km/h

/* =========================================================
   State + persistence (local first, cloud sync when available)
   ========================================================= */
const KEY='seaready.v1';
function blank(){return{v:1,updatedAt:0,profile:{name:'',age:20,sex:'m',height:178,weight:75,track:'general',aim:'',baseline:'',start:today(),diet:'omni',goal:'maintain',equip:'none',voice:true,setup:false},done:{},bleep:[],acts:[],vo2:[],quick:[],sync:{}}}
let S=blank();
try{const raw=localStorage.getItem(KEY);if(raw){S=Object.assign(blank(),JSON.parse(raw));S.profile=Object.assign(blank().profile,S.profile)}}catch(e){}
let cloud={db:null,ref:null,on:false,writing:false,dirty:false,t:null};
// HOSTED = running on your own site (Cloudflare) rather than inside Claude
const HOSTED=!(window.claude&&typeof window.claude.use==='function');
const API={ok:false,kv:false,strava:false};
const SK='seaready.key';let syncKey=null;try{syncKey=localStorage.getItem(SK)}catch(e){}
function setKey(k){syncKey=k;try{k?localStorage.setItem(SK,k):localStorage.removeItem(SK)}catch(e){}}
function genKey(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const b=new Uint8Array(24);crypto.getRandomValues(b);let o='';b.forEach((x,i)=>{o+=A[x%32];if(i%4===3&&i<23)o+='-'});return o}
async function api(path,opts={}){const h=Object.assign({'content-type':'application/json'},opts.headers||{});if(syncKey)h['x-sync-key']=syncKey;const r=await fetch(path,Object.assign({},opts,{headers:h,cache:'no-store'}));let d=null;try{d=await r.json()}catch(e){}return{status:r.status,ok:r.ok,data:d}}
function adopt(r){S=Object.assign(blank(),JSON.parse(JSON.stringify(r)));S.profile=Object.assign(blank().profile,S.profile);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render(true)}
async function hostedPull(){if(!API.kv||!syncKey)return;try{const r=await api('/api/state');if(r.status===200&&r.data){cloud.on=true;if(r.data.updatedAt>S.updatedAt)adopt(r.data);else if(S.updatedAt>r.data.updatedAt){cloud.dirty=true;flushCloud()}}else if(r.status===404){cloud.on=true;cloud.dirty=true;flushCloud()}else cloud.on=false}catch(e){cloud.on=false}refreshSyncPill()}
async function initHosted(){
  if(location.protocol==='file:')return;
  try{const r=await api('/api/health');if(r.ok&&r.data&&r.data.ok){API.ok=true;API.kv=!!r.data.kv;API.strava=!!r.data.strava}}catch(e){}
  await hostedPull();
  if(route==='sync'||route==='profile')render(true);
  const q=new URLSearchParams(location.search).get('strava');
  if(q){history.replaceState(null,'',location.pathname+'#sync');const M={connected:'Strava connected — syncing now',denied:'Strava access was declined',scope:'Strava needs permission to read your activities — try again and leave that box ticked',expired:'That Strava sign-in took too long — try again',failed:'Strava sign-in failed — try again'};toast(M[q]||'Strava: '+q);if(q==='connected'){if(route!=='sync'){location.hash='#sync'}setTimeout(stravaSync,600)}}
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')hostedPull()});
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('/sw.js').catch(()=>{});
}
async function ensureKey(){if(syncKey)return true;if(!API.kv)return false;setKey(genKey());cloud.dirty=true;await flushCloud();cloud.on=true;refreshSyncPill();toast('Sync turned on — your key is on the Profile page');return true}
function save(quiet){S.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}queueCloud();if(!quiet)refreshSyncPill()}
function queueCloud(){if(HOSTED?!(API.kv&&syncKey):!cloud.ref)return;cloud.dirty=true;clearTimeout(cloud.t);cloud.t=setTimeout(flushCloud,1200)}
async function flushCloud(){if(HOSTED)return flushHosted();if(!cloud.ref||cloud.writing||!cloud.dirty)return;cloud.writing=true;cloud.dirty=false;try{await cloud.ref.set(JSON.parse(JSON.stringify(S)))}catch(e){if(e&&e.code==='invalid_argument'){cloud.ref=null;cloud.on=false;refreshSyncPill()}else if(e&&e.code==='quota_exceeded'){toast('Cloud storage is full — trim old activities')}else{cloud.dirty=true;setTimeout(flushCloud,4000+Math.random()*2000)}}cloud.writing=false;if(cloud.dirty)setTimeout(flushCloud,300)}
async function flushHosted(){if(!API.kv||!syncKey||cloud.writing||!cloud.dirty)return;cloud.writing=true;cloud.dirty=false;try{const r=await api('/api/state',{method:'PUT',body:JSON.stringify(S)});if(r.status===409&&r.data&&r.data.state){adopt(r.data.state);toast('Newer data from another device loaded')}else if(!r.ok)throw r;cloud.on=true}catch(e){cloud.on=false;cloud.dirty=true;setTimeout(flushHosted,8000+Math.random()*4000)}cloud.writing=false;refreshSyncPill();if(cloud.dirty&&cloud.on)setTimeout(flushHosted,300)}
function refreshSyncPill(){const p=$('#syncPill');p.classList.toggle('on',cloud.on);p.lastElementChild.textContent=cloud.on?'Synced':'This device';p.title=cloud.on?(HOSTED?'Synced across your linked devices':'Saved to your Claude account — open this page on any device to see it'):'Saved in this browser only'}
async function initCloud(){
  if(HOSTED)return initHosted();
  try{
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;const id=await user.id();if(!id)return;
    cloud.db=db;cloud.ref=db.doc('data/users/'+id+'/state');
    let first=true;
    cloud.ref.onSnapshot(snap=>{
      if(snap.metadata&&snap.metadata.hasPendingWrites)return;
      cloud.on=true;refreshSyncPill();
      if(snap.exists){const r=snap.data();if(r&&r.updatedAt>S.updatedAt){S=Object.assign(blank(),JSON.parse(JSON.stringify(r)));S.profile=Object.assign(blank().profile,S.profile);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render(true)}else if(first&&S.updatedAt>(r?.updatedAt||0)){cloud.dirty=true;flushCloud()}}
      else if(first&&S.updatedAt>0){cloud.dirty=true;flushCloud()}
      first=false;
    },err=>{cloud.on=false;refreshSyncPill()});
  }catch(e){}
}

/* =========================================================
   Profile helpers & standards
   ========================================================= */
const TOTAL_DAYS=182;
function std(){const p=S.profile;const diver=p.track==='diver';const pass=diver?toSh(10,5):toSh(6,6);const defAim=diver?toSh(11,4):toSh(8,6);const aim=parseLS(p.aim);return{diver,pass,aim:Math.max(pass,aim??defAim),label:diver?'RN Diver':'RN general entry'}}
const dayIdx=(d=today())=>diffDays(S.profile.start,d);
const testDate=()=>addDays(S.profile.start,TOTAL_DAYS);
function phaseOf(w){return w<=8?{n:1,name:'Base',desc:'Aerobic base, movement quality, tendon prep'}:w<=16?{n:2,name:'Build',desc:'More intervals, heavier strength, shuttle-specific work'}:w<=22?{n:3,name:'Peak',desc:'Race-pace shuttles, power, highest load'}:{n:4,name:'Sharpen',desc:'Lower volume, keep intensity, arrive fresh'}}
const isDeloadWeek=w=>w%4===0&&w<23;

/* =========================================================
   Data-driven fitness estimate & adaptation
   ========================================================= */
function runPoints(){return S.acts.filter(a=>a.type==='run'&&a.km>=1.5&&a.km<=25&&a.min>0).map(a=>{const kmh=a.km/(a.min/60);if(kmh<6.5||kmh>22)return null;const v=vdot(a.km,a.min);return v?{date:a.date.slice(0,10),vo2:v}:null}).filter(Boolean)}
function estimatePoints(){
  const pts=[];S.bleep.forEach(b=>pts.push({date:b.date,sh:b.sh,src:'bleep'}));
  S.vo2.forEach(v=>pts.push({date:v.date,sh:shFromVO2(v.value),src:'apple'}));
  // best run estimate per 14-day block
  const byBlock={};runPoints().forEach(r=>{const k=Math.floor(dayIdx(r.date)/14);if(!byBlock[k]||r.vo2>byBlock[k].vo2)byBlock[k]=r});
  Object.values(byBlock).forEach(r=>pts.push({date:r.date,sh:shFromVO2(r.vo2),src:'run'}));
  return pts.sort((a,b)=>a.date<b.date?-1:1);
}
function currentEstimate(){
  const t=today();const recent=(arr,days)=>arr.filter(x=>diffDays(x.date,t)<=days&&diffDays(x.date,t)>=0);
  const bl=recent(S.bleep,28).sort((a,b)=>a.date<b.date?1:-1)[0];
  if(bl)return{sh:bl.sh,src:'Bleep test '+fmtShort(bl.date),conf:'high'};
  const c=[];const rp=recent(runPoints(),28);if(rp.length){const best=Math.max(...rp.map(r=>r.vo2));c.push({sh:shFromVO2(best),src:'Best run, last 28 days'})}
  const av=recent(S.vo2,60).sort((a,b)=>a.date<b.date?1:-1)[0];if(av)c.push({sh:shFromVO2(av.value),src:'Apple VO₂ max'});
  if(c.length)return{sh:Math.round(c.reduce((s,x)=>s+x.sh,0)/c.length),src:c.map(x=>x.src).join(' + '),conf:'medium'};
  const old=[...S.bleep].sort((a,b)=>a.date<b.date?1:-1)[0];if(old)return{sh:old.sh,src:'Bleep test '+fmtShort(old.date)+' (old)',conf:'low'};
  const b=parseLS(S.profile.baseline);if(b!=null)return{sh:b,src:'Your starting estimate',conf:'low'};
  return null;
}
function baselineSh(){const b=parseLS(S.profile.baseline);if(b!=null)return b;const pts=estimatePoints().filter(p=>dayIdx(p.date)<=21);if(pts.length)return pts[0].sh;const c=currentEstimate();return c?c.sh:toSh(5,2)}
function expectedAt(d){const st=std();const B=Math.min(baselineSh(),st.aim);return B+(st.aim-B)*clamp(d/168,0,1)}
function projection(){const pts=estimatePoints().filter(p=>diffDays(p.date,today())<=70);if(pts.length<2)return null;const xs=pts.map(p=>dayIdx(p.date)),ys=pts.map(p=>p.sh);if(Math.max(...xs)-Math.min(...xs)<10)return null;const n=xs.length,mx=xs.reduce((a,b)=>a+b)/n,my=ys.reduce((a,b)=>a+b)/n;let num=0,den=0;xs.forEach((x,i)=>{num+=(x-mx)*(ys[i]-my);den+=(x-mx)**2});const slope=clamp(num/den,-0.3,0.35);const cur=currentEstimate();const base=cur?cur.sh:my;return{slope,atTest:Math.round(base+slope*Math.max(0,TOTAL_DAYS-dayIdx()))}}
function plannedMins(s){return s?s.mins||0:0}
function adaptation(){
  const t=today(),di=dayIdx(t),st=std(),cur=currentEstimate();
  const A={vol:1,int:1,extraEngine:false,overload:false,status:'unknown',notes:[],cur,st,di};
  const exp=expectedAt(Math.max(0,di));A.expected=Math.round(exp);
  // Training load: acute (7 d) vs chronic (28 d) minutes from synced/logged activities
  const minsIn=(from,to)=>S.acts.filter(a=>{const d=diffDays(a.date.slice(0,10),t);return d>=from&&d<to}).reduce((s,a)=>s+(a.min||0),0)+S.quick.filter(q=>{const d=diffDays(q.date,t);return d>=from&&d<to}).reduce((s,q)=>s+q.min,0);
  const acute=minsIn(0,7),chronic=minsIn(0,28)/4;A.acute=acute;A.chronic=Math.round(chronic);A.acwr=chronic>45?acute/chronic:null;
  // Compliance over last 14 days of plan
  let planned=0,done=0;for(let k=1;k<=14;k++){const d=addDays(t,-k);const i=dayIdx(d);if(i<0)continue;const s=baseSession(i);if(s.kind==='rest')continue;planned++;if(statusOf(d,s)==='done')done++}
  A.compliance=planned>=4?done/planned:null;A.planned=planned;A.doneCount=done;
  if(!cur){A.status='unknown';A.notes.push({c:'w',t:'No fitness reading yet. Do a bleep test (or sync Strava / Apple Health) so the plan can set your paces and track you against the standard.'})}
  else{
    const gap=cur.sh-exp;A.gap=gap;
    A.status=gap>=4?'ahead':gap>=-4?'on':gap>=-10?'behind':'well';
    if(A.status==='ahead')A.notes.push({c:'',t:`You're ${Math.round(gap)} shuttles ahead of schedule. Intensity stays where it is; consider raising your aim on the Profile page.`});
    if(A.status==='on')A.notes.push({c:'',t:'On track for your aim. Progression continues as written.'});
    if(A.status==='behind'||A.status==='well'){A.int=A.status==='well'?1.35:1.2;A.extraEngine=true;A.notes.push({c:A.status==='well'?'b':'w',t:`${Math.round(-gap)} shuttles behind schedule. Interval reps increased ${Math.round((A.int-1)*100)}% and the mid-week recovery day becomes a short shuttle session.`})}
    if(cur.sh<st.pass&&di>120)A.notes.push({c:'b',t:'Less than 9 weeks left and still under the pass standard. Prioritise every shuttle session and test every 2 weeks.'})
  }
  if(A.acwr&&A.acwr>1.5){A.overload=true;A.vol=0.8;A.int=Math.min(A.int,0.85);A.extraEngine=false;A.notes.push({c:'w',t:`This week's load is ${A.acwr.toFixed(1)}× your 4-week average — a spike that raises injury risk. Volume cut 20% until it settles.`})}
  else if(A.acwr&&A.acwr<0.7&&A.chronic>60)A.notes.push({c:'',t:'Load has dropped well below your recent average. Ease back in rather than jumping straight to full sessions.'});
  if(A.compliance!=null&&A.compliance<0.5){A.int=Math.min(A.int,1);A.vol=Math.min(A.vol,1);A.extraEngine=false;A.notes.push({c:'w',t:`Only ${A.doneCount} of ${A.planned} sessions completed in the last fortnight. Progression is held until consistency is back — 3 sessions a week minimum.`})}
  else if(A.compliance!=null&&A.compliance>=0.85&&A.status!=='well')A.notes.push({c:'',t:`${Math.round(A.compliance*100)}% of sessions completed in the last fortnight. Good consistency.`});
  // paces
  const curSh=cur?cur.sh:toSh(5,2);A.vo2=vo2FromSh(curSh);A.vmax=vVO2(A.vo2);
  A.proj=projection();
  return A;
}

/* =========================================================
   Training plan (2-week rotation × 13 = 26 weeks)
   ========================================================= */
const ROT=[
  {k:'easy',kind:'run'},{k:'strA',kind:'str'},{k:'shuttle',kind:'hard'},{k:'mob',kind:'mob'},{k:'strB',kind:'str'},{k:'long',kind:'run'},{k:'rest',kind:'rest'},
  {k:'tempo',kind:'hard'},{k:'strA',kind:'str'},{k:'intervals',kind:'hard'},{k:'easycore',kind:'run'},{k:'strB',kind:'str'},{k:'longprog',kind:'run'},{k:'check',kind:'rest'}
];
const EX={
  strA:{gym:['Trap-bar deadlift','Isometric mid-thigh pull — 5 × 5 s max effort on a fixed bar','Bulgarian split squat','Bent-over barbell row','Farmer carry 4 × 30 m'],
        db:['Dumbbell Romanian deadlift','Isometric pull — stand on a towel or band, pull up hard 5 × 5 s','Goblet squat','One-arm dumbbell row','Suitcase carry 4 × 30 m'],
        none:['Towel isometric pull — stand on a towel, pull up as hard as you can, 5 × 5 s','Single-leg Romanian deadlift','Rear-foot elevated split squat','Backpack row (load a rucksack)','Glute bridge march']},
  strB:{gym:['Seated 4 kg med-ball chest throw against a wall — 5 × 5, max intent','Bench press','Pull-ups (band-assisted if needed)','Push press','Front plank 3 × 45 s'],
        db:['Seated chest throw — 4 kg ball or bag, 5 × 5, max intent','Dumbbell floor press','Pull-ups or inverted rows','Dumbbell push press','Dead bug 3 × 10/side'],
        none:['Seated chest throw — 4 kg rucksack or water bottle pack, 5 × 5','Explosive (clap or hand-release) press-ups','Pike press-ups','Table / doorframe rows','Hollow hold 3 × 30 s']}
};
function scheme(ph){return ph===1?'3 × 10, controlled':ph===2?'4 × 6, heavier':ph===3?'4 × 4, heavy + fast':'3 × 3, fast, leave 2 in the tank'}
function baseSession(i){if(i<0||i>TOTAL_DAYS)return{kind:'none'};const r=ROT[i%14];return{key:r.k,kind:r.kind}}
function sessionFor(i,A){
  if(i<0)return{kind:'none',title:'Before start',sum:'Plan starts '+fmtDate(S.profile.start),blocks:[],mins:0};
  if(i>=TOTAL_DAYS)return{kind:'test',title:'Test day',sum:'Pre-Joining Fitness Test window',blocks:['Complete the MSFT at your aim pace.'],mins:20};
  const w=Math.floor(i/7)+1,ph=phaseOf(w),r=ROT[i%14],rot=Math.floor(i/14)+1;
  const dl=isDeloadWeek(w)?0.7:1;const taper=ph.n===4?0.75:1;
  const vol=A.vol*dl*taper,int=A.int*(dl<1?0.8:1);
  const v=A.vmax,st=A.st,cur=A.cur?A.cur.sh:toSh(5,2);
  const p=x=>paceStr(v*x);
  const curL=fromSh(cur).L;const tgtL=fromSh(st.aim).L;const shL=clamp(ph.n===1?curL:Math.min(tgtL,curL+1),3,21);
  const equip=S.profile.equip||'none';
  const R=n=>Math.max(1,Math.round(n));
  let s={kind:r.kind,key:r.k,week:w,rot,phase:ph,deload:dl<1};
  // First day with no reading → baseline test
  if(i===0&&!A.cur){return Object.assign(s,{kind:'test',title:'Baseline bleep test',sum:'Find your start point',mins:25,blocks:['10 min warm-up: easy jog, leg swings, 3 × 20 m build-ups','Run the bleep test on the Bleep page until you miss 3 lines in a row','Log the result — every pace in the plan is set from it']})}
  switch(r.k){
    case 'easy':{const m=R(clamp(20+1.4*(w-1),20,45)*vol);return Object.assign(s,{title:'Easy run',sum:`${m} min easy + strides`,mins:m+6,blocks:[`${m} min at conversational pace (${p(.62)}–${p(.7)})`,'4 × 20 s strides, walk back recovery','5 min mobility: calves, hips, hamstrings']})}
    case 'easycore':{const m=R(clamp(20+1.2*(w-1),20,40)*vol);return Object.assign(s,{title:'Easy run + core',sum:`${m} min easy, 10 min core`,mins:m+10,blocks:[`${m} min easy (${p(.62)}–${p(.7)})`,'Core × 2 rounds: 40 s plank, 30 s side plank each side, 12 dead bugs, 10 bird dogs/side',st.diver?'Diver add-on: sit-up practice 3 × max (aim 40 total)':'Finish: 2 × 10 slow sit-ups']})}
    case 'long':case 'longprog':{const m=R(clamp(30+2*(w-1),30,70)*vol*(A.status==='well'?1.1:1));const prog=r.k==='longprog'&&ph.n>1;return Object.assign(s,{title:prog?'Progression run':'Long run',sum:`${m} min${prog?', finish fast':' steady'}`,mins:m,blocks:prog?[`${R(m*.7)} min easy (${p(.65)})`,`${R(m*.3)} min building to tempo (${p(.82)}–${p(.86)})`,'Cool down 5 min walk']:[`${m} min steady at ${p(.62)}–${p(.7)} — cross-training (bike/swim/rower) is fine for up to half`,'Hydrate and refuel within the hour']})}
    case 'tempo':{const m=R(clamp(12+0.8*(w-1),12,28)*vol);return Object.assign(s,{title:'Tempo run',sum:`${m} min at threshold`,mins:m+20,blocks:['10 min easy warm-up + 3 strides',ph.n===1?`${R(m/2)} min × 2 at ${p(.84)}, 3 min easy between`:`${m} min continuous at ${p(.85)}–${p(.88)} — comfortably hard`,'10 min easy cool-down']})}
    case 'shuttle':{const reps=R(clamp(4+Math.floor(w/3),4,12)*int);const work=ph.n>=3?75:60;return Object.assign(s,{title:'Shuttle intervals',sum:`${reps} × ${work}s at level ${shL}`,mins:R(15+reps*(work+60)/60),blocks:['10 min warm-up: jog, A-skips, 4 × 20 m build-ups with sharp turns',`${reps} × ${work} s of 20 m shuttles at level ${shL} pace (Bleep page → Practice from level ${shL}), 60 s walk`,'Turn technique: plant the outside foot on the line, stay low, push off hard','5 min easy jog + calf/hip stretch']})}
    case 'intervals':{const reps=R(clamp(4+Math.floor(w/4),4,8)*int);const dur=ph.n===1?2:ph.n===2?3:ph.n===3?3:2;return Object.assign(s,{title:'Intervals',sum:`${reps} × ${dur} min hard`,mins:R(20+reps*(dur+1.5)),blocks:['10 min easy + 3 strides',`${reps} × ${dur} min at ${p(.95)}–${p(1)} (hard, controlled), 90 s jog recovery`,'10 min easy cool-down']})}
    case 'strA':case 'strB':{const list=EX[r.k][equip]||EX[r.k].none;const ex=list.map((e,j)=>j<2&&r.k==='strB'||j===1&&r.k==='strA'?e:e+' — '+scheme(ph.n));if(st.diver)ex.push('Diver test practice: max press-ups, max sit-ups (2 min), max pull-ups — log your numbers');return Object.assign(s,{title:r.k==='strA'?'Strength: pull & legs':'Strength: push & power',sum:r.k==='strA'?'Mid-thigh pull focus':'Med-ball throw focus',mins:R(45*vol),blocks:['8 min warm-up: band pull-aparts, squats, hip hinges, 2 light ramp sets',...ex]})}
    case 'mob':{if(A.extraEngine&&dl===1)return Object.assign(s,{kind:'hard',title:'Extra: shuttle fartlek',sum:'15 min aerobic shuttles',mins:20,blocks:['Added because you are behind schedule','5 min easy jog','10 × 30 s shuttles at level '+curL+' pace, 30 s walk','5 min mobility']});return Object.assign(s,{title:'Mobility & recovery',sum:'20–30 min easy',mins:25,blocks:['10 min walk or easy spin','Hips: 90/90 switches, hip flexor stretch 2 × 45 s/side','Calves and ankles: wall ankle rocks 2 × 15, calf raises 2 × 15','Thoracic rotations, cat-cow, child\'s pose']})}
    case 'rest':return Object.assign(s,{title:'Rest',sum:'Full rest day',mins:0,blocks:['Sleep 8+ hours','Walk, stretch, eat well']});
    case 'check':{if(rot%2===0||rot===13)return Object.assign(s,{kind:'test',title:'Check-in bleep test',sum:'Measure progress',mins:25,blocks:['10 min warm-up + 3 build-ups','Bleep test to failure — Bleep page','The result re-scales every pace and target in the plan']});return Object.assign(s,{title:'Rest',sum:'Rest — check-in next rotation',mins:0,blocks:['Full rest']})}
  }
  return s;
}
function matchedActivity(d,s){if(!s||s.kind==='rest'||s.kind==='none')return null;const want=s.kind==='str'?['strength']:s.kind==='mob'?['walk','other','strength','ride','swim']:['run'];return S.acts.find(a=>a.date.slice(0,10)===d&&want.includes(a.type))||null}
function statusOf(d,s){const rec=S.done[d];if(rec)return rec.status;if(s&&s.kind==='test'&&S.bleep.some(b=>b.date===d))return 'done';return matchedActivity(d,s)?'done':null}

const dietOk=(m,diet)=>diet==='omni'?true:diet==='pesc'?m.d!=='o':m.d==='v';
function targets(i,A){
  const p=S.profile;const bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==='f'?-161:5);
  const s=sessionFor(i,A);const hard=s.kind==='hard'||s.kind==='test'||s.key==='long'||s.key==='longprog';const rest=s.kind==='rest'||s.kind==='mob';
  const factor=hard?1.7:rest?1.4:1.55;let kcal=bmr*factor+(p.goal==='lean'?-350:p.goal==='gain'?300:0);kcal=Math.round(kcal/10)*10;
  const pro=Math.round(p.weight*1.8),fat=Math.round(p.weight*0.9),carb=Math.max(100,Math.round((kcal-pro*4-fat*9)/4));
  return{kcal,pro,fat,carb,hard,rest,s};
}
function mealDay(i,A){
  const p=S.profile,T=targets(i,A);const pool=sl=>MEALS.filter(m=>m.s===sl&&dietOk(m,p.diet));
  const pick=(sl,o)=>{const a=pool(sl);return a[((i*(o+3))+o*5)%a.length]};
  const list=[{slot:'Breakfast',m:pick('b',1)},{slot:'Lunch',m:pick('l',2)},{slot:'Dinner',m:pick('d',3)},{slot:'Snack',m:pick('s',4)}];
  if(T.hard){list.splice(2,0,{slot:'Pre-session',m:MEALS.find(m=>m.s==='pre')});list.push({slot:'Recovery',m:MEALS.find(m=>m.s==='post')})}
  else list.push({slot:'Snack 2',m:pick('s',7)});
  const base=list.reduce((s,x)=>s+x.m.k,0);const scale=clamp(T.kcal/base,0.75,1.6);
  const tot={k:0,p:0,c:0,f:0};list.forEach(x=>{['k','p','c','f'].forEach(q=>tot[q]+=x.m[q]*scale)});
  return{T,list,scale,tot};
}

let AC=null;
function audio(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}const b=AC.createBuffer(1,1,22050);const src=AC.createBufferSource();src.buffer=b;src.connect(AC.destination);src.start(0)}if(AC.state==='suspended')AC.resume();return AC}
function tone(at,freq=1046,dur=.16,vol=.6){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=freq;g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(vol*.35,at+.008);g.gain.setValueAtTime(vol*.35,at+dur-.03);g.gain.linearRampToValueAtTime(0,at+dur);o.connect(g).connect(AC.destination);o.start(at);o.stop(at+dur+.02);LIVE.push(o);if(LIVE.length>40)LIVE.splice(0,20)}
const LIVE=[];function hush(){LIVE.forEach(o=>{try{o.stop()}catch(e){}});LIVE.length=0}

    S.sync.strava=new Date().toISOString();save();toast(n?`Strava: ${n} new activit${n===1?'y':'ies'}`:'Strava: already up to date');render(true);
  }catch(e){const c=e&&e.code;btn.disabled=false;btn.textContent='Sync Strava';
    const M={server_not_connected:['Not connected','Add Strava in claude.ai → Settings → Connectors, then press Sync again.','w'],needs_reauth:['Reconnect','Reconnect Strava in claude.ai → Settings → Connectors.','b'],approval_required:['Needs approval','Press Sync and choose Allow when Claude asks to let this page use Strava.','w'],not_in_manifest:['Blocked','Strava access is turned off for this page. Turn it back on from the page\'s connector settings in Claude.','b'],selection_required:['Choose account','You have more than one Strava connection — pick one in the prompt Claude shows.','w'],blocked_by_policy:['Blocked','Your organisation blocks this connector.','b'],server_unavailable:['Strava busy','Strava didn\'t answer. Try again in a minute.','w'],tool_error:['Error','Strava returned an error: '+(e&&e.message||''),'b']};
    const x=M[c]||['Error',(e&&e.message)||'Sync failed.','b'];tag.textContent=x[0];tag.className='tag '+x[2];msg.textContent=x[1];}
}
function attrs(tag){const o={};tag.replace(/([\w:]+)="([^"]*)"/g,(_,k,v)=>{o[k]=v});return o}
function appleDate(s){const m=String(s).match(/(\d{4}-\d\d-\d\d) (\d\d:\d\d:\d\d) ([+-]\d\d)(\d\d)/);return m?m[1]+'T'+m[2]:String(s).slice(0,19)}
async function importApple(file){
  const msg=$('#appleMsg'),pw=$('#appleProgW'),pb=$('#appleProg');pw.style.display='block';msg.textContent='Reading '+file.name+'…';
  const cut=addDays(today(),-365);const found=[],vo2=[];let bytes=0;
  const onWorkout=blk=>{const open=blk.slice(0,blk.indexOf('>')+1);const a=attrs(open);const date=appleDate(a.startDate||'');if(date.slice(0,10)<cut)return;let min=num(a.duration);if(a.durationUnit==='s'||a.durationUnit==='sec')min/=60;if(a.durationUnit==='hr'||a.durationUnit==='h')min*=60;let km=null;if(a.totalDistance){km=num(a.totalDistance);if(/mi/.test(a.totalDistanceUnit||''))km*=1.609;if(a.totalDistanceUnit==='m')km/=1000}
    if(km==null){const m=blk.match(/<WorkoutStatistics[^>]*type="HKQuantityTypeIdentifierDistance(?:WalkingRunning|Cycling|Swimming)"[^>]*>/);if(m){const s=attrs(m[0]);km=num(s.sum);if(/mi/.test(s.unit||''))km*=1.609;if(s.unit==='m'||s.unit==='yd')km/=1000}}
    const t=(a.workoutActivityType||'').replace('HKWorkoutActivityType','');if(!min)return;found.push({id:'apple-'+date+'-'+Math.round(min),src:'Apple',type:normType(t),name:t.replace(/([a-z])([A-Z])/g,'$1 $2'),date,min,km:km&&km>0?km:null})};
  const onVO2=tag=>{const a=attrs(tag);const d=appleDate(a.startDate||'').slice(0,10);if(d>=cut&&num(a.value))vo2.push({date:d,value:num(a.value)})};
  const sc=scanner(onWorkout,onVO2);
  try{
    if(/\.zip$/i.test(file.name)||file.type.includes('zip')){
      await loadScript('https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js');if(!window.fflate)throw new Error('Could not load the unzip library — unzip it in Files and choose export.xml instead.');
      await new Promise((res,rej)=>{let gotXml=false;const uz=new fflate.Unzip();uz.register(fflate.UnzipInflate);const dec=new TextDecoder();
        uz.onfile=f=>{if(/(^|\/)export\.xml$/i.test(f.name)){gotXml=true;f.ondata=(err,chunk,fin)=>{if(err){rej(err);return}sc.push(dec.decode(chunk,{stream:!fin}));if(fin)res()};f.start()}};
        const rd=file.stream().getReader();(async()=>{try{for(;;){const {value,done}=await rd.read();if(done){uz.push(new Uint8Array(0),true);if(!gotXml)rej(new Error('No export.xml found in that zip.'));break}bytes+=value.length;pb.style.width=(bytes/file.size*100)+'%';uz.push(value,false);await new Promise(r=>setTimeout(r,0))}}catch(e){rej(e)}})()});
    }else{const rd=file.stream().pipeThrough(new TextDecoderStream()).getReader();for(;;){const {value,done}=await rd.read();if(done)break;bytes+=value.length;pb.style.width=Math.min(100,bytes/file.size*100)+'%';sc.push(value)}}
    const n=mergeActs(found);const seen=new Set(S.vo2.map(v=>v.date));vo2.forEach(v=>{if(!seen.has(v.date)){S.vo2.push(v);seen.add(v.date)}});S.vo2=S.vo2.sort((a,b)=>a.date<b.date?-1:1).slice(-120);
    S.sync.apple=new Date().toISOString();save();pb.style.width='100%';toast(`Apple: ${n} new workouts, ${vo2.length} VO₂ readings`);render(true);
  }catch(e){msg.textContent='Import failed: '+(e.message||e);pw.style.display='none'}
}
function scanner(onW,onV){let buf='';const VT='<Record type="HKQuantityTypeIdentifierVO2Max"';return{push(text){buf+=text;let pos=0,pending=-1;for(;;){const wi=buf.indexOf('<Workout ',pos),vi=buf.indexOf(VT,pos);if(wi<0&&vi<0)break;const i=wi<0?vi:vi<0?wi:Math.min(wi,vi);const e=buf.indexOf('>',i);if(e<0){pending=i;break}if(i===vi){onV(buf.slice(i,e+1));pos=e+1;continue}if(buf[e-1]==='/'){onW(buf.slice(i,e+1));pos=e+1;continue}const c=buf.indexOf('</Workout>',e);if(c<0){pending=i;break}onW(buf.slice(i,c+10));pos=c+10}buf=pending>=0?buf.slice(pending):buf.slice(-60)}}}
function loadScript(src){return new Promise(r=>{if(document.querySelector(`script[src="${src}"]`)){r();return}const s=document.createElement('script');s.src=src;s.onload=()=>r();s.onerror=()=>r();document.head.appendChild(s)})}
function parseCsv(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}if(f||row.length){row.push(f);rows.push(row)}return rows}
function stravaCsvDate(s){const m=String(s).match(/([A-Za-z]{3})\s+(\d{1,2}),\s*(\d{4}),?\s+(\d{1,2}):(\d\d):(\d\d)\s*(AM|PM)?/i);if(!m){const d=new Date(s);return isNaN(d)?null:d.toISOString().slice(0,19)}let h=+m[4];if(m[7]){const pm=m[7].toUpperCase()==='PM';if(pm&&h<12)h+=12;if(!pm&&h===12)h=0}return `${m[3]}-${z2(MON.indexOf(m[1].slice(0,1).toUpperCase()+m[1].slice(1,3).toLowerCase())+1)}-${z2(m[2])}T${z2(h)}:${m[5]}:${m[6]}`}
async function importCsv(file){try{const rows=parseCsv(await file.text());const h=rows[0].map(x=>x.trim());const ix=n=>h.indexOf(n);const iD=ix('Activity Date'),iT=ix('Activity Type'),iN=ix('Activity Name'),iE=ix('Elapsed Time'),iM=ix('Moving Time'),iK=ix('Distance'),iI=ix('Activity ID');if(iD<0||iE<0)throw new Error('This doesn\'t look like Strava\'s activities.csv');
  const list=rows.slice(1).filter(r=>r.length>5).map(r=>{const date=stravaCsvDate(r[iD]);const sec=num(iM>=0&&r[iM]?r[iM]:r[iE]);if(!date||!sec)return null;let km=num(r[iK]);const type=normType(r[iT]);if(km&&type!=='swim'&&km>300)km/=1000;return{id:'strava-'+(r[iI]||date),src:'Strava CSV',type,name:r[iN]||'',date,min:sec/60,km:km>0?km:null}});
  const n=mergeActs(list);save();toast(`Imported ${n} activities`);render(true)}catch(e){toast(e.message||'Import failed')}}

/* ---------------- Profile ---------------- */
function vProfile(A){const p=S.profile,st=A.st;
  const opt=(id,cur,list)=>`<select class="inp" id="${id}">${list.map(([v,l])=>`<option value="${v}"${String(cur)===String(v)?' selected':''}>${l}</option>`).join('')}</select>`;
  return `<div class="eyebrow">You</div><h1>Profile</h1><p class="lead">These set your targets, paces and portions. ${cloud.on?(HOSTED?'Synced — the same data shows on every device linked with your key.':'Saved to your Claude account — the same data shows on your laptop, iPhone and iPad.'):(HOSTED?'Saved in this browser. Turn on sync below to share it with your other devices.':'Saved in this browser. Open the page in Claude while signed in to sync across devices.')}</p>
  <section class="card x" data-reveal><div class="grid g3">
    <label class="f">Name<input class="inp" id="pName" value="${esc(p.name)}" placeholder="Optional"></label>
    <label class="f">Age<input class="inp" id="pAge" inputmode="numeric" value="${p.age}"></label>
    <label class="f">Sex (for calorie maths)${opt('pSex',p.sex,[['m','Male'],['f','Female']])}</label>
    <label class="f">Height cm<input class="inp" id="pH" inputmode="numeric" value="${p.height}"></label>
    <label class="f">Weight kg<input class="inp" id="pW" inputmode="decimal" value="${p.weight}"></label>
    <label class="f">Plan start date<input class="inp" type="date" id="pStart" value="${p.start}"></label>
  </div></section>
  <section class="card" data-reveal><div class="eyebrow">Standard</div><div class="grid g3" style="margin-top:12px">
    <label class="f">Training for${opt('pTrack',p.track,[['general','RN general entry — MSFT 6.6'],['diver','RN Diver — MSFT 10.5 + 30/40/4']])}</label>
    <label class="f">Your aim (level.shuttle)<input class="inp" id="pAim" value="${esc(p.aim)}" placeholder="${fmtLS(st.diver?toSh(11,4):toSh(8,6))} (default)" inputmode="decimal"></label>
    <label class="f">Starting level if known<input class="inp" id="pBase" value="${esc(p.baseline)}" placeholder="e.g. 5.4 — or do a test" inputmode="decimal"></label>
    <label class="f">Equipment${opt('pEq',p.equip,[['none','None / home'],['db','Dumbbells / kettlebell'],['gym','Full gym']])}</label>
    <label class="f">Diet${opt('pDiet',p.diet,[['omni','Everything'],['pesc','Pescatarian'],['veg','Vegetarian']])}</label>
    <label class="f">Body goal${opt('pGoal',p.goal,[['maintain','Maintain'],['lean','Lean out slowly'],['gain','Build muscle']])}</label>
  </div><p class="small muted" style="margin-top:14px">From 1 October 2026 the Royal Navy Pre-Joining Fitness Test drops the 2.4 km run. It is the bleep test (level 6.6 for all candidates, 10.5 for divers), an isometric mid-thigh pull and a seated 4 kg medicine-ball throw. The plan's strength days train those last two. <a href="https://www.royalnavy.mod.uk/careers/joining-process/pre-joining-fitness-test">Check the current standard</a>.</p>
  <button class="btn" style="margin-top:16px" data-act="saveProfile">Save profile</button></section>
  ${HOSTED?syncCard():''}
  <section class="card" data-reveal><div class="eyebrow">Backup</div><p class="small" style="margin:8px 0 12px">Copy your data as text to keep a backup, or paste one to restore.</p><div class="row"><button class="btn ghost sm" data-act="copyData">Copy backup</button><button class="btn ghost sm" data-act="showRestore">Restore</button><button class="btn danger sm" data-act="resetAll">Reset everything</button></div><div id="restoreBox"></div></section>`;
}
function syncCard(){
  let body;
  if(!API.ok)body='<p class="small">This copy can\'t reach a server, so data stays in this browser. Deploy to Cloudflare with the functions folder to sync devices.</p>';
  else if(!API.kv)body='<p class="small">The server is up but sync storage isn\'t. Add the SEAREADY KV binding in Cloudflare (see README), then redeploy.</p>';
  else if(syncKey)body=`<p class="small" style="margin:8px 0 12px">This device is linked. To add your iPhone, iPad or laptop, open the site there, go to Profile and paste this key. Keep it private — it's the password to your data.</p><div class="disp" id="keyText" style="font-size:22px;letter-spacing:.06em;word-break:break-all">${syncKey.slice(0,4)}-••••-••••-••••-••••-••••</div><div class="row" style="margin-top:12px"><button class="btn sm" data-act="syncCopy">Copy key</button><button class="btn ghost sm" data-act="syncShow">Show / hide</button><button class="btn danger sm" data-act="syncUnlink">Unlink this device</button></div>`;
  else body=`<p class="small" style="margin:8px 0 12px">Turn on sync on your first device to get a key, then paste that key on your other devices.</p><div class="row"><button class="btn sm" data-act="syncOn">Turn on sync</button></div><div class="hr"></div><label class="f">Already have a key?<input class="inp" id="linkKey" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XXXX" autocapitalize="characters" autocomplete="off"></label><button class="btn ghost sm" style="margin-top:10px" data-act="syncLink">Link this device</button>`;
  return `<section class="card x" data-reveal><div class="row" style="justify-content:space-between"><div class="eyebrow">Sync between devices</div>${cloud.on?'<span class="tag t">Synced</span>':''}</div>${body}</section>`;
}
function saveProfile(){const p=S.profile;const g=id=>$('#'+id).value.trim();const aim=g('pAim'),base=g('pBase');if(aim&&parseLS(aim)==null){toast('Aim should look like 8.6');return}if(base&&parseLS(base)==null){toast('Starting level should look like 5.4');return}
  const startChanged=p.start!==g('pStart');Object.assign(p,{name:g('pName'),age:clamp(+g('pAge')||20,15,60),sex:g('pSex'),height:clamp(+g('pH')||175,130,220),weight:clamp(+g('pW')||70,35,200),start:g('pStart')||today(),track:g('pTrack'),aim,baseline:base,equip:g('pEq'),diet:g('pDiet'),goal:g('pGoal'),setup:true});if(startChanged)ui.planRot=null;save();toast('Profile saved');location.hash='#home'}

/* =========================================================
   Events
   ========================================================= */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  switch(a){
    case 'openDay':openDay(+el.dataset.i);break;
    case 'closeSheet':closeSheet();break;
    case 'logDay':{const d=el.dataset.d,s=el.dataset.s;if(s==='clear')delete S.done[d];else{const r=$('#rpe button.on');S.done[d]={status:s,rpe:r?+r.dataset.v:null,at:Date.now()}}save();closeSheet();render(true);toast(s==='done'?'Logged — nice work':s==='skipped'?'Marked as skipped':'Cleared');break}
    case 'rot':ui.planRot=+el.dataset.r;render(true);break;
    case 'rotPrev':ui.planRot=Math.max(0,ui.planRot-1);render(true);break;
    case 'rotNext':ui.planRot=Math.min(12,ui.planRot+1);render(true);break;
    case 'rotNow':ui.planRot=null;render(true);break;
    case 'mealDay':ui.mealDay=+el.dataset.i;render(true);break;
    case 'shop':ui.shop=!ui.shop;render(true);break;
    case 'qf':ui.quickFocus=el.dataset.f;render(true);break;
    case 'qshuffle':ui.quickSeed++;render(true);break;
    case 'qstart':startQuick();break;
    case 'qpause':qt.paused=!qt.paused;el.textContent=qt.paused?'Resume':'Pause';break;
    case 'qskip':qtGo(1);break;
    case 'qback':if(qt.B[qt.idx].secs-qt.left<3&&qt.idx>0)qtGo(-1);else{qt.left=qt.B[qt.idx].secs;qtClock()}break;
    case 'qstop':finishQuick(false);break;
    case 'bStart':startBleep();break;
    case 'bMiss':bleepMiss();break;
    case 'bStop':endBleep('stop');break;
    case 'bAbort':endBleep('abort');break;
    case 'bAdj':bleep.result=clamp(bleep.result+(+el.dataset.d),0,CUM[21]);renderBleepResult();break;
    case 'bSave':S.bleep.push({id:uid(),date:today(),sh:bleep.result});save();$('#layer').innerHTML='';render(true);toast('Saved — plan recalculated');break;
    case 'bDiscard':$('#layer').innerHTML='';break;
    case 'bManual':{const v=parseLS($('#bManual').value);const d=$('#bManualD').value||today();if(v==null){toast('Enter a level like 7.4');break}S.bleep.push({id:uid(),date:d,sh:v});save();render(true);toast('Result added');break}
    case 'delBleep':S.bleep=S.bleep.filter(b=>b.id!==el.dataset.id);save();render(true);break;
    case 'stravaSync':stravaSync();break;
    case 'stravaConnect':stravaConnect();break;
    case 'stravaDisconnect':stravaDisconnect();break;
    case 'syncOn':if(await ensureKey())render(true);else toast('Sync storage isn\'t set up on the server');break;
    case 'syncLink':{const k=($('#linkKey').value||'').trim().toUpperCase();if(k.length<20){toast('Paste the full key from your other device');break}const old=syncKey;setKey(k);const r=await api('/api/state');if(r.status===200&&r.data){adopt(r.data);cloud.on=true;refreshSyncPill();toast('Linked — data loaded from your other device')}else{setKey(old);toast(r.status===404?'No data found for that key':'Could not reach the server')}break}
    case 'syncCopy':try{await navigator.clipboard.writeText(syncKey);toast('Key copied')}catch(err){toast('Select the key and copy it')}break;
    case 'syncShow':{const e=$('#keyText');e.textContent=e.textContent.includes('•')?syncKey:syncKey.slice(0,4)+'-••••-••••-••••-••••-••••';break}
    case 'syncUnlink':if(el.dataset.c){setKey(null);cloud.on=false;refreshSyncPill();render(true);toast('This device is unlinked')}else{el.dataset.c='1';el.textContent='Tap again to unlink';setTimeout(()=>{if(el.isConnected){delete el.dataset.c;el.textContent='Unlink this device'}},3000)}break;
    case 'manualAdd':{const min=num($('#mMin').value);if(!min){toast('Add the minutes');break}const km=num($('#mKm').value);const d=$('#mDate').value||today();mergeActs([{id:'man-'+uid(),src:'Manual',type:$('#mType').value,name:'',date:d+'T12:00:00',min,km:km||null}]);save();render(true);toast('Activity added');break}
    case 'delAct':S.acts=S.acts.filter(x=>x.id!==el.dataset.id);save();render(true);break;
    case 'clearActs':if(el.dataset.c){S.acts=[];S.vo2=[];S.sync={};save();render(true)}else{el.dataset.c='1';el.textContent='Tap again to confirm';setTimeout(()=>{if(el.isConnected){delete el.dataset.c;el.textContent='Clear all'}},3000)}break;
    case 'saveProfile':saveProfile();break;
    case 'copyData':try{await navigator.clipboard.writeText(JSON.stringify(S));toast('Backup copied')}catch(err){$('#restoreBox').innerHTML=`<textarea class="inp" rows="5" style="margin-top:12px" readonly>${esc(JSON.stringify(S))}</textarea><p class="small muted">Select all and copy.</p>`}break;
    case 'showRestore':$('#restoreBox').innerHTML=`<textarea class="inp" id="restoreTxt" rows="5" style="margin-top:12px" placeholder="Paste backup here"></textarea><button class="btn sm" style="margin-top:10px" data-act="doRestore">Restore backup</button>`;break;
    case 'doRestore':try{const o=JSON.parse($('#restoreTxt').value);if(!o||!o.profile)throw 0;S=Object.assign(blank(),o);S.profile=Object.assign(blank().profile,o.profile);save();render();toast('Restored')}catch(err){toast('That backup could not be read')}break;
    case 'resetAll':if(el.dataset.c){S=blank();save();location.hash='#home';render()}else{el.dataset.c='1';el.textContent='Tap again to reset';setTimeout(()=>{if(el.isConnected){delete el.dataset.c;el.textContent='Reset everything'}},3000)}break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if(bleep.running&&(e.key===' '||e.key==='m')){e.preventDefault();bleepMiss()}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&(bleep.running||qt.running))keepAwake(true)});

refreshSyncPill();render();initCloud();
</script>
